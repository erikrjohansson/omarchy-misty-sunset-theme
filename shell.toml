[bar]
background = "#18151E"
background-alpha = 0.98
text = "#ECE3D9"
active = "#E9AC76"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#746388"
active-border-foreground = "#746388"

[controls]
normal-color = "foreground"
normal-fill-alpha = 0.04
normal-border = "foreground"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "#E9AC76"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#E9AC76"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color = "#E9AC76"
focus-fill-alpha = 0.08
focus-border = "#E9AC76"
focus-border-width = 1
focus-border-alpha = 0.65
selected-color = "#E9AC76"
selected-fill-alpha = 0.18
selected-border = "#E9AC76"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 1

[tooltip]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
border = "#423A4C"
border-alpha = 1.0

[notifications]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 1
countdown = "#E9AC76"

[launcher]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "#0B090E"
scrim-alpha = 0.35
selected-background = "#E9AC76"
selected-background-alpha = 0.18
selected-text = "#F7F3EC"
selected-border = "#E9AC76"
selected-border-alpha = 0.5

[menu]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "#0B090E"
scrim-alpha = 0.35
selected-background = "#E9AC76"
selected-background-alpha = 0.18
selected-text = "#F7F3EC"
selected-border = "#E9AC76"
selected-border-alpha = 0.5

[polkit]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
text-error = "#D99794"
border = "hyprland.active-border"
border-error = "#D99794"
border-alpha = 1.0
scrim = "#0B090E"
scrim-alpha = 0.5
accent = "#E9AC76"

[lock]
background = "#18151E"
background-alpha = 0.95
text = "#ECE3D9"
placeholder = "#CBBAAF"
text-error = "#D99794"
border = "#423A4C"
border-active = "#E9AC76"
border-error = "#D99794"
border-alpha = 1.0
selection = "#E9AC76"
selection-alpha = 0.15

[image-picker]
scrim = "#0B090E"
scrim-alpha = 0.5
text = "#ECE3D9"
selected-border = "#E9AC76"
selected-border-alpha = 1.0
unselected-border = "foreground"
unselected-border-alpha = 0.28
